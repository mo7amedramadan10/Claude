# Full stack in two containers: the app (API + frontend) and SQL Server.
# Required in .env (same folder): SQL_PASSWORD, ANTHROPIC_API_KEY — see DEPLOY.md.
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD:?set SQL_PASSWORD in .env}
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__DataDb: "Server=db;Database=ChatToDashboard;User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=True"
      Anthropic__ApiKey: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in .env}
      Anthropic__Model: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      EnableRag: ${ENABLE_RAG:-false}
      DataFolderPath: /data
    volumes:
      # Put your .csv/.xlsx/.json files here; POST /api/data/refresh reloads them.
      - ./data:/data

volumes:
  mssql-data:
