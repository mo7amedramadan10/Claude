# Non-secret runtime settings. Anything sensitive (API keys, SQL password, connection
# string) lives in the 'ai-dashboard-secrets' Secret created by the pipeline — see
# secret.example.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-dashboard-config
  namespace: ai-dashboard
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  DataFolderPath: "/data"
  DatabaseProvider: "SqlServer"
  EnableRag: "false"
  # "OpenAI" or "Anthropic" — the default provider; admins can switch per-question from the UI.
  Llm__Provider: "OpenAI"
  OpenAI__Model: "gpt-4o"
  Anthropic__Model: "claude-sonnet-5"
  # Internal Ollama gateway (only used if an admin switches the provider to Ollama).
  Ollama__BaseUrl: "http://172.17.242.1:8081/api/v1/"
  Ollama__Model: "qwen3:14b"
  Auth__SeedAdmin__Username: "admin"
