# EXAMPLE ONLY — never commit real values.
#
# The pipeline creates this Secret from the Azure DevOps variable group 'ai-dashboard'
# (Pipelines > Library). To create it by hand instead:
#
#   kubectl -n ai-dashboard create secret generic ai-dashboard-secrets \
#     --from-literal=SQL_PASSWORD='A_Strong_Passw0rd!' \
#     --from-literal=ConnectionStrings__DataDb='Server=mssql;Database=ChatToDashboard;User Id=sa;Password=A_Strong_Passw0rd!;TrustServerCertificate=True' \
#     --from-literal=OpenAI__ApiKey='sk-...' \
#     --from-literal=Anthropic__ApiKey='sk-ant-...' \
#     --from-literal=Ollama__ApiKey='' \
#     --from-literal=Auth__SeedAdmin__Password='ChangeMe123!'
#
apiVersion: v1
kind: Secret
metadata:
  name: ai-dashboard-secrets
  namespace: ai-dashboard
type: Opaque
stringData:
  SQL_PASSWORD: "A_Strong_Passw0rd!"
  ConnectionStrings__DataDb: "Server=mssql;Database=ChatToDashboard;User Id=sa;Password=A_Strong_Passw0rd!;TrustServerCertificate=True"
  OpenAI__ApiKey: "sk-..."
  Anthropic__ApiKey: "sk-ant-..."
  Ollama__ApiKey: ""
  Auth__SeedAdmin__Password: "ChangeMe123!"
