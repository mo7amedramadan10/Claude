# The app (API + UI in one container). The image tag is injected by the pipeline —
# IMAGE_PLACEHOLDER is replaced with <registry>/ai-dashboard:<build id> at deploy time.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-dashboard-data
  namespace: ai-dashboard
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-dashboard
  namespace: ai-dashboard
  labels:
    app: ai-dashboard
spec:
  replicas: 1
  strategy:
    type: Recreate   # single RWO data volume; avoid two pods writing /data at once
  selector:
    matchLabels:
      app: ai-dashboard
  template:
    metadata:
      labels:
        app: ai-dashboard
    spec:
      securityContext:
        fsGroup: 1654          # 'app' user in the aspnet image
      initContainers:
        # First start only: copy the seed files baked into the image into the empty volume.
        - name: seed-data
          image: IMAGE_PLACEHOLDER
          command: ["/bin/sh", "-c", "if [ -z \"$(ls -A /data)\" ]; then cp -r /seed/. /data/; echo seeded; else echo 'data volume already populated'; fi"]
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: app
          image: IMAGE_PLACEHOLDER
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: ai-dashboard-config
            - secretRef:
                name: ai-dashboard-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              memory: "2Gi"
          # index.html is served before authentication, so it's a safe probe target.
          readinessProbe:
            httpGet:
              path: /index.html
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /index.html
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ai-dashboard-data
---
apiVersion: v1
kind: Service
metadata:
  name: ai-dashboard
  namespace: ai-dashboard
spec:
  selector:
    app: ai-dashboard
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Direct access by IP (no DNS needed): http://172.17.131.40:30080
apiVersion: v1
kind: Service
metadata:
  name: ai-dashboard-nodeport
  namespace: ai-dashboard
spec:
  type: NodePort
  selector:
    app: ai-dashboard
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
---
# Access by hostname through ingress-nginx (port 80 on the server). Point a DNS record
# (or a hosts-file entry) for ai-dashboard.multiapps.local at 172.17.131.40.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-dashboard
  namespace: ai-dashboard
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"   # file uploads
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600" # long LLM responses
spec:
  ingressClassName: nginx
  rules:
    - host: ai-dashboard.multiapps.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ai-dashboard
                port:
                  number: 80
