name: saudi_marketplace
description: Premium Saudi marketplace app — Arabic-first, RTL by default.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ─── State Management ───────────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ─── Navigation ─────────────────────────────────────────────────
  go_router: ^14.2.0

  # ─── Backend (Supabase) ──────────────────────────────────────────
  supabase_flutter: ^2.5.3

  # ─── Push Notifications (FCM) ────────────────────────────────────
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^17.2.2

  # ─── Maps ────────────────────────────────────────────────────────
  google_maps_flutter: ^2.7.0
  geolocator: ^13.0.1

  # ─── Fonts & Icons ───────────────────────────────────────────────
  google_fonts: ^6.2.1
  flutter_tabler_icons: ^1.1.0

  # ─── Image Handling ──────────────────────────────────────────────
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0

  # ─── UI Utilities ────────────────────────────────────────────────
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  gap: ^3.0.1

  # ─── Local Storage ───────────────────────────────────────────────
  shared_preferences: ^2.3.1
  flutter_secure_storage: ^9.2.2

  # ─── Utilities ───────────────────────────────────────────────────
  intl: ^0.19.0
  url_launcher: ^6.3.0
  permission_handler: ^11.3.1
  connectivity_plus: ^6.0.3
  package_info_plus: ^8.0.2
  path_provider: ^2.1.3
  uuid: ^4.4.2
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
