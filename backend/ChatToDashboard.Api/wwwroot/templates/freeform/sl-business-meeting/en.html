<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Business Meeting</title>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* نموذج «اجتماع عمل»: خلفية مشهد قاعة اجتماعات بالأزرق، عنوان كبير أبيض في المنتصف وتحته عنوان فرعي، وثلاث بطاقات بيضاء برأس كحلي متدرّج فيه عنوان وأيقونة خطية. */
  :root { --font: 'Open Sans', 'Segoe UI', Arial, sans-serif; --ink: #1F2328; --accent: #2B45A8; --navy: #1B2C7A; --navy-2: #2A3FA0; --bg: #2940A8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #1F2430; font-family: var(--font); color: var(--ink); }
  body { padding-bottom: var(--jeem-strip-h, 0px); overflow: hidden; }
  .deck { position: relative; height: calc(100vh - var(--jeem-strip-h, 0px)); }
  .slide { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; }
  .slide.active { display: flex; }
  /* الإطار بحجم ثابت 1280×720 يُصغَّر ليلائم الشاشة؛ flex:none ضروري وإلا يُقص في المعاينة الضيقة */
  .frame { position: relative; flex: none; width: 1280px; height: 720px; background: var(--bg); overflow: hidden; transform-origin: center center; box-shadow: 0 20px 60px rgb(0 0 0 / .35); }
  .frame svg { display: block; }
  .scene { position: absolute; inset: 0; width: 1280px; height: 720px; object-fit: cover; }
  .ttl { position: absolute; top: 24px; inset-inline-start: 0; width: 1280px; margin: 0; text-align: center; font-size: 60px; font-weight: 700; line-height: 1.25; color: #fff; }
  .sub { position: absolute; top: 108px; inset-inline-start: 0; width: 1280px; margin: 0; text-align: center; font-size: 21px; font-weight: 400; line-height: 1.4; color: #fff; letter-spacing: .3px; }
  html[lang="ar"] .ttl { font-size: 56px; line-height: 1.35; top: 16px; }
  html[lang="ar"] .sub { top: 106px; letter-spacing: 0; }
  .card { position: absolute; top: 519px; width: 331px; height: 147px; border-radius: 14px; background: linear-gradient(180deg, #FFFFFF, #EEF1F2); box-shadow: 0 4px 10px rgb(0 0 40 / .18); }
  .c1 { inset-inline-start: 109px; } .c2 { inset-inline-start: 475px; } .c3 { inset-inline-start: 840px; }
  .card .hd { position: absolute; top: 0; inset-inline-start: 0; width: 331px; height: 57px; border-radius: 14px; background: linear-gradient(90deg, var(--navy), var(--navy-2) 55%, #1C2D76); display: flex; align-items: center; justify-content: space-between; padding-inline: 20px 18px; }
  .card h2 { margin: 0; font-size: 22px; font-weight: 700; line-height: 1.2; color: #fff; }
  .card .ic { width: 42px; height: 42px; color: #fff; flex: none; }
  .card .ic svg { width: 42px; height: 42px; }
  .card p { position: absolute; top: 72px; inset-inline-start: 20px; width: 300px; margin: 0; font-size: 18.5px; line-height: 1.35; color: #222; }
  html[lang="ar"] .card p { font-size: 17.5px; line-height: 1.45; top: 68px; }
  /* التنقّل */
  .nav { position: fixed; bottom: calc(14px + var(--jeem-strip-h, 0px)); inset-inline-start: 50%; transform: translateX(-50%); display: flex; gap: 8px; align-items: center; z-index: 5; background: rgb(0 0 0 / .45); color: #fff; padding: 6px 10px; border-radius: 999px; font-size: 14px; }
  .nav button { background: #fff; color: var(--ink); border: 0; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 16px; }
  .nav button:focus-visible { outline: 3px solid #4FB3FF; outline-offset: 2px; }
  .progress { position: fixed; top: 0; inset-inline-start: 0; height: 4px; background: var(--accent); width: 0; z-index: 6; transition: width .25s; }
  @media (prefers-reduced-motion: reduce) { .progress { transition: none; } *, *::before, *::after { animation: none !important; transition: none !important; } }
  @media print {
    html, body { background: #fff; height: auto; overflow: visible; }
    .deck { height: auto; } .slide { position: static; display: flex !important; page-break-after: always; height: 100vh; }
    .frame { transform: none !important; box-shadow: none; } .nav, .progress { display: none; }
    @page { size: 1280px 720px; margin: 0; }
  }
</style>
</head>
<body>
<div class="progress" id="progress"></div>
<div class="deck" id="deck">
  <!-- 1 -->
  <section class="slide active"><div class="frame s1">
    <img class="scene" src="/templates/freeform/sl-business-meeting/assets/scene.jpg" alt="Illustration of a team around a meeting table in front of a presentation screen">
    <h1 class="ttl">Business Meeting</h1>
    <p class="sub">SUBTITLE GOES HERE.</p>
    <div class="card c1"><div class="hd"><h2>Edit Text Here</h2><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width=".8" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 5h11l4 5-9.5 10L2.5 10z"/><path d="M2.5 10h19M9 5l-2 5 5 10 5-10-2-5M7 10l2.5-5M17 10l-2.5-5M12 5v0"/></svg></span></div><p>This is a sample text. Insert your desired text here.</p></div>
    <div class="card c2"><div class="hd"><h2>Edit Text Here</h2><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width=".9" aria-hidden="true"><circle cx="12" cy="9.3" r="2.3"/><circle cx="5.2" cy="7" r="2"/><circle cx="18.8" cy="7" r="2"/><path d="M7.6 17.5c0-2.6 2-4.6 4.4-4.6s4.4 2 4.4 4.6z"/><path d="M1.2 14.8c0-2.3 1.8-4.1 4-4.1 1 0 1.9.3 2.6.9"/><path d="M22.8 14.8c0-2.3-1.8-4.1-4-4.1-1 0-1.9.3-2.6.9"/></svg></span></div><p>This is a sample text. Insert your desired text here.</p></div>
    <div class="card c3"><div class="hd"><h2>Edit Text Here</h2><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width=".9" aria-hidden="true"><circle cx="11" cy="13" r="8.5"/><circle cx="11" cy="13" r="5.6"/><circle cx="11" cy="13" r="2.7"/><path d="M11 13l9-9M16.8 4.3l.3 2.6 2.6.3 2.3-2.3-2.6-.3-.3-2.6z"/></svg></span></div><p>This is a sample text. Insert your desired text here.</p></div>
  </div></section>
</div>
<div class="nav"><button type="button" id="prev" aria-label="Previous">‹</button><span id="counter">1 / 1</span><button type="button" id="next" aria-label="Next">›</button></div>
<script>
(function () {
  var RTL = document.documentElement.dir === 'rtl';

  // ----- التنقّل -----
  var slides = Array.prototype.slice.call(document.querySelectorAll('.slide')), cur = 0;
  function fit() { var deck = document.getElementById('deck'), s = Math.min(deck.clientWidth / 1280, deck.clientHeight / 720); slides.forEach(function (sl) { sl.querySelector('.frame').style.transform = 'scale(' + s + ')'; }); }
  function go(i) {
    i = Math.max(0, Math.min(slides.length - 1, i)); cur = i;
    slides.forEach(function (s, j) { s.classList.toggle('active', j === i); });
    document.getElementById('counter').textContent = (i + 1) + ' / ' + slides.length;
    document.getElementById('progress').style.width = ((i + 1) / slides.length * 100) + '%';
    document.dispatchEvent(new CustomEvent('jeem:slide', { detail: { index: i } }));
  }
  window.goToSlide = go;
  document.getElementById('next').addEventListener('click', function () { go(cur + 1); });
  document.getElementById('prev').addEventListener('click', function () { go(cur - 1); });
  document.addEventListener('keydown', function (e) {
    if (e.target && (e.target.isContentEditable || /INPUT|TEXTAREA/.test(e.target.tagName))) return;
    var fwd = RTL ? 'ArrowLeft' : 'ArrowRight', back = RTL ? 'ArrowRight' : 'ArrowLeft';
    if (e.key === fwd || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); go(cur + 1); }
    if (e.key === back || e.key === 'PageUp') { e.preventDefault(); go(cur - 1); }
    if (e.key === 'Home') go(0); if (e.key === 'End') go(slides.length - 1);
  });
  var tx = null;
  document.addEventListener('touchstart', function (e) { tx = e.touches[0].clientX; }, { passive: true });
  document.addEventListener('touchend', function (e) { if (tx == null) return; var dx = e.changedTouches[0].clientX - tx; tx = null; if (Math.abs(dx) > 50) go((RTL ? dx > 0 : dx < 0) ? cur + 1 : cur - 1); });
  window.addEventListener('resize', fit); fit(); go(0);
  var obs = new MutationObserver(fit); obs.observe(document.documentElement, { attributes: true, attributeFilter: ['style'] });
})();
</script>
<script src="/js/jeem-slides.js"></script>
</body>
</html>
