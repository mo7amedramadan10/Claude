<style>
:root{--ar:0.5625;}
html,body{margin:0;height:100%;background:#1c2128;color:#e6e9ee;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
.deck{position:relative;height:calc(100% - var(--jeem-strip-h,0px));display:flex;flex-direction:column}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:16px}
.slide{display:none;width:min(100%,calc((100vh - 96px - var(--jeem-strip-h,0px)) / var(--ar)));aspect-ratio:1 / var(--ar);background:#fff;box-shadow:0 12px 40px rgba(0,0,0,.45);border-radius:6px;overflow:hidden}
.slide.active{display:block}
.slide svg{display:block;width:100%;height:100%}
.bar{display:flex;align-items:center;justify-content:center;gap:12px;padding:10px 16px;background:#11151b}
.bar button{background:#2a323c;color:#e6e9ee;border:1px solid #3a4452;border-radius:10px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
.bar button:hover{background:#364050}
.pos{min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
.prog{position:absolute;top:0;inset-inline-start:0;height:3px;background:#2A78D6;width:0;transition:width .25s}
@media (prefers-reduced-motion: reduce){.prog{transition:none}}
@media print{html,body{overflow:visible;background:#fff}.bar,.prog{display:none}.stage{display:block;padding:0}.slide{display:block!important;width:100%;box-shadow:none;border-radius:0;page-break-after:always;break-after:page}}
</style>

ction:rtl;line-height:1.2;white-space:pre-wrap;word-wrap:break-word;"><span style="font-family:'Tanseek Modern Pro Arabic Medium','IBM Plex Sans Arabic',Arial,sans-serif;font-size:53.33px;color:#444445;">الثقة هي علاقة</span><span style="font-family:'Tanseek Modern Pro Arabic Medium','IBM Plex Sans Arabic',Arial,sans-serif;font-size:53.33px;color:#444445;"></span><span style="font-family:'Tanseek Modern Pro Arabic Medium','IBM Plex Sans Arabic',Arial,sans-serif;font-size:53.33px;color:#444445;">اعتماد بين اثنان</span><span style="font-family:'Tanseek Modern Pro Arabic Medium','IBM Plex Sans Arabic',Arial,sans-serif;font-size:53.33px;color:#444445;">, </span><span style="font-family:'Tanseek Modern Pro Arabic Medium','IBM Plex Sans Arabic',Arial,sans-serif;font-size:53.33px;color:#444445;"> الشخص المؤتمن عليه من المفترض ان يفي</span><span style="font-family:'Tanseek Modern Pro Arabic Medium','IBM Plex Sans Arabic',Arial,sans-serif;font-size:53.33px;color:#444445;"></span><span style="font-family:'Tanseek Modern Pro Arabic Medium','IBM Plex Sans Arabic',Arial,sans-serif;font-size:53.33px;color:#444445;">بوعده</span></p><p style="margin:0px 0 0;padding-inline-start:0px;text-align:start;direction:rtl;line-height:1.2;white-space:pre-wrap;word-wrap:break-word;"><span style="font-family:'Tanseek Modern Pro Arabic Medium','IBM Plex Sans Arabic',Arial,sans-serif;font-size:53.33px;color:#444445;">هي رمز وقيمة اخلاقية وايفاء بالوعود.</span></p><p style="margin:0px 0 0;padding-inline-start:0px;text-align:start;direction:rtl;line-height:1.2;white-space:pre-wrap;word-wrap:break-word;"><span style="font-family:'Tanseek Modern Pro Arabic Medium','IBM Plex Sans Arabic',Arial,sans-serif;font-size:53.33px;color:#444445;">الثقة تتضمن عدم الشك في اعتقاد الشخصية الجيدة، </span><span style="font-family:'Tanseek Modern Pro Arabic Medium','IBM Plex Sans Arabic',Arial,sans-serif;font-size:53.33px;color:#444445;">نوأيا</span><span style="font-family:'Tanseek Modern Pro Arabic Medium','IBM Plex Sans Arabic',Arial,sans-serif;font-size:53.33px;color:#444445;"> أو اخلاق الشخص الآخر. والثقة لا تتطلب ان تكون موجودة في الأشخاص ذو النوايا الحسنة فقط ، الثقة هي توقع النوايا الحسنة مبنية على معرفة المرء بالإنسان الاخر. الثقة هي كلمة عن </span><span style="font-family:'Tanseek Modern Pro Arabic Medium','IBM Plex Sans Arabic',Arial,sans-serif;font-size:53.33px;color:#444445;">ماهو</span><span style="font-family:'Tanseek Modern Pro Arabic Medium','IBM Plex Sans Arabic',Arial,sans-serif;font-size:53.33px;color:#444445;"> المجهول على سبيل المثال </span><span style="font-family:'Tanseek Modern Pro Arabic Medium','IBM Plex Sans Arabic',Arial,sans-serif;font-size:53.33px;color:#444445;">لانها</span><span style="font-family:'Tanseek Modern Pro Arabic Medium','IBM Plex Sans Arabic',Arial,sans-serif;font-size:53.33px;color:#444445;"> لا يمكن رؤية نتائجها في المستقبل.</span></p></div></foreignObject></g></svg>
