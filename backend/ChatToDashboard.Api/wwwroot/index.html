<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>المحادثة إلى لوحة معلومات</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Crect x='8' y='16' width='4' height='9' rx='1.5' fill='white'/%3E%3Crect x='14' y='11' width='4' height='14' rx='1.5' fill='white'/%3E%3Crect x='20' y='7' width='4' height='18' rx='1.5' fill='white'/%3E%3C/svg%3E" />
<style>
:root{
  --surface:#fcfcfb; --plane:#f9f9f7; --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --line:#c3c2b7; --accent:#2a78d6; --accent-soft:#eaf2fd; --danger:#d03b3b;
  --radius:14px; --shadow:0 1px 2px rgba(11,11,11,.05), 0 1px 8px rgba(11,11,11,.04);
}
*{box-sizing:border-box}
body{margin:0;background:var(--plane);color:var(--ink);
  font-family:"Segoe UI","Noto Naskh Arabic",system-ui,-apple-system,sans-serif;font-size:14px}
button{font:inherit;cursor:pointer}
input{font:inherit}

/* ---------- header ---------- */
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--grid)}
.brand{display:flex;align-items:center;gap:9px;font-weight:700}
.brand .dot{width:22px;height:22px;border-radius:6px;background:var(--accent)}
nav.tabs{display:flex;gap:4px;margin-inline-start:8px}
.tab{padding:6px 14px;border:1px solid transparent;border-radius:999px;background:transparent;
  color:var(--ink-2);text-decoration:none;display:inline-block}
.tab:hover{background:var(--plane)}
.tab.active{background:var(--accent-soft);color:var(--accent);border-color:#cfe1f8;font-weight:600}
.tab .badge{display:inline-block;min-width:19px;padding:0 5px;margin-inline-start:6px;border-radius:999px;
  background:var(--accent);color:#fff;font-size:11px;line-height:18px;text-align:center}

/* ---------- sources dropdown ---------- */
.sources{position:relative;margin-inline-start:auto}
#sources-btn{display:flex;align-items:center;gap:8px;padding:7px 13px;
  border:1px solid var(--grid);border-radius:10px;background:var(--surface);color:var(--ink-2)}
#sources-btn:hover{border-color:var(--line)}
#sources-panel{position:absolute;inset-inline-end:0;top:calc(100% + 7px);z-index:40;width:290px;
  max-height:70vh;overflow:auto;padding:8px;background:var(--surface);
  border:1px solid var(--grid);border-radius:var(--radius);box-shadow:0 8px 28px rgba(11,11,11,.12)}
#sources-panel.hidden{display:none}
.source-item{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;cursor:pointer}
.source-item:hover{background:var(--plane)}
.source-item input{accent-color:var(--accent);width:15px;height:15px}
.source-item.head{font-weight:600}
.source-item .note{margin-inline-start:auto;font-size:11px;color:var(--muted)}
.source-item .grow{flex:1}
.refresh-btn{padding:2px 8px;border:1px solid var(--grid);border-radius:7px;background:var(--surface);
  color:var(--accent);font-size:11.5px;line-height:1.6}
.refresh-btn:hover{border-color:var(--accent);background:var(--accent-soft)}
.refresh-btn:disabled{opacity:.5;cursor:progress}
.sys-status{padding:0 9px 6px 31px;font-size:11px;color:var(--muted);line-height:1.55}
.sys-status.bad{color:var(--danger)}
#sources-panel hr{border:0;border-top:1px solid var(--grid);margin:7px 4px}
.nested{padding-inline-start:22px}
.nested-empty{padding:6px 9px;font-size:12px;color:var(--muted)}

/* ---------- layout ---------- */
.screen{display:none}
.screen.active{display:flex}
#screen-chat{height:calc(100vh - 53px)}
#chat-rail{width:35%;min-width:320px;display:flex;flex-direction:column;
  background:var(--surface);border-inline-start:1px solid var(--grid)}
#dash-pane{flex:1;overflow-y:auto;padding:20px}

#messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:86%;padding:9px 13px;border-radius:14px;line-height:1.65;white-space:pre-wrap}
.msg.user{align-self:flex-start;background:var(--accent);color:#fff;border-end-start-radius:5px}
.msg.bot{align-self:flex-end;background:var(--plane);border:1px solid var(--grid);border-end-end-radius:5px}
.msg.err{align-self:flex-end;background:#fdf0f0;border:1px solid #f3d0d0;color:#9b2c2c}
.hint{margin:auto;padding:14px;border-radius:12px;background:var(--plane);color:var(--ink-2);text-align:center}
.hint .ex{display:block;margin-top:6px;color:var(--muted);font-size:13px}
.dots span{display:inline-block;width:6px;height:6px;margin:0 1px;border-radius:50%;
  background:var(--muted);animation:b .9s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.25}30%{opacity:1}}

#repo-link{display:flex;align-items:center;gap:10px;padding:9px 16px;
  border-top:1px solid var(--grid);color:var(--ink-2);font-size:13px}
#repo-link button{margin-inline-start:auto;padding:5px 11px;border:1px solid var(--grid);
  border-radius:8px;background:var(--surface);color:var(--accent)}
form#form{display:flex;gap:8px;padding:14px;border-top:1px solid var(--grid)}
#q{flex:1;padding:10px 13px;border:1px solid var(--grid);border-radius:11px;outline:none}
#q:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
#send{padding:10px 18px;border:0;border-radius:11px;background:var(--accent);color:#fff;font-weight:600}
#send:disabled{opacity:.45;cursor:not-allowed}

/* ---------- widgets ---------- */
#summary{margin-bottom:16px;padding:14px 17px;background:var(--surface);
  border:1px solid var(--grid);border-radius:var(--radius);box-shadow:var(--shadow);line-height:1.75}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px}
.card{position:relative;background:var(--surface);border:1px solid var(--grid);
  border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.card.wide{grid-column:1/-1}
.card-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card h3{margin:0;font-size:13px;font-weight:600;color:var(--ink-2)}
.src-btn{width:19px;height:19px;padding:0;border:1px solid var(--grid);border-radius:50%;
  background:var(--surface);color:var(--muted);font-size:12px;line-height:1}
.src-btn:hover,.src-btn.active{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.src-pop{display:none;position:absolute;inset-inline-end:14px;top:44px;z-index:20;width:min(330px,90%);
  padding:12px;background:var(--surface);border:1px solid var(--grid);border-radius:12px;
  box-shadow:0 8px 28px rgba(11,11,11,.14);font-size:12.5px;line-height:1.7}
.src-pop.open{display:block}
.src-block+.src-block{margin-top:9px;padding-top:9px;border-top:1px solid var(--grid)}
.src-lbl{display:block;margin-bottom:2px;font-size:11px;font-weight:700;color:var(--accent)}
.card>.kpi{font-size:40px;font-weight:600;letter-spacing:-.5px;line-height:1.15}
.kpi-label{margin-top:5px;color:var(--muted)}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--muted);font-size:11px;font-family:inherit}
.mark{transition:opacity .12s}.mark:hover{opacity:.82}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-inline-end:5px}
.tbl-wrap{max-height:340px;overflow:auto;border:1px solid var(--grid);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{position:sticky;top:0;background:var(--plane);text-align:start;padding:8px 11px;
  font-weight:600;color:var(--ink-2);border-bottom:1px solid var(--grid);white-space:nowrap}
td{padding:7px 11px;border-bottom:1px solid #f1f0ec;white-space:nowrap}
td.num{text-align:end;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
#tip{position:fixed;z-index:60;padding:6px 9px;border-radius:8px;background:#0b0b0b;color:#fff;
  font-size:12px;pointer-events:none;opacity:0;transition:opacity .1s}
.empty{display:flex;align-items:center;justify-content:center;height:70vh;text-align:center;color:var(--muted)}
.empty .big{font-size:17px;color:var(--ink-2);margin-bottom:5px}
.skeleton .card{height:230px}
.skeleton .bar{height:100%;border-radius:9px;background:linear-gradient(90deg,#f1f0ec,#f7f6f3,#f1f0ec);
  background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ---------- repository screen ---------- */
#screen-repo{flex-direction:column;padding:20px;gap:16px;height:calc(100vh - 53px);overflow-y:auto}
.repo-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.upload-btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:11px;
  background:var(--accent);color:#fff;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 13px;border:1px solid var(--grid);border-radius:999px;background:var(--surface);color:var(--ink-2)}
.chip.active{background:var(--accent-soft);border-color:#cfe1f8;color:var(--accent);font-weight:600}
#pending{display:flex;flex-direction:column;gap:9px}
.pending-card{display:flex;align-items:center;gap:11px;padding:11px 14px;background:#fffbea;
  border:1px solid #f0e2b6;border-radius:12px}
.pending-card .name{flex:1;font-size:13px}
.pending-card input{width:210px;padding:7px 11px;border:1px solid var(--grid);border-radius:9px}
.pending-card .save{padding:7px 14px;border:0;border-radius:9px;background:var(--accent);color:#fff;font-weight:600}
.pending-card .cancel{border:0;background:transparent;color:var(--danger);font-size:18px;font-weight:700}
.pending-card.bad{background:#fdf0f0;border-color:#f3d0d0}
.repo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.repo-card{position:relative;padding:16px;background:var(--surface);border:1px solid var(--grid);
  border-radius:var(--radius);box-shadow:var(--shadow)}
.repo-card .icon{font-size:26px}
.repo-card .name{margin-top:8px;font-weight:600;font-size:13px;word-break:break-word}
.cat-badge{display:inline-block;margin-top:8px;padding:3px 10px;border-radius:999px;
  background:var(--accent-soft);color:var(--accent);font-size:11.5px;font-weight:600}
.repo-card .meta{margin-top:9px;font-size:12px;color:var(--muted)}
.repo-card .del{position:absolute;inset-inline-end:11px;top:11px;border:0;background:transparent;
  color:var(--muted);font-size:15px}
.repo-card .del:hover{color:var(--danger)}
.repo-empty{grid-column:1/-1;padding:44px;text-align:center;color:var(--muted);
  border:1px dashed var(--grid);border-radius:var(--radius)}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span><span>المحادثة إلى لوحة معلومات</span></div>

  <nav class="tabs">
    <button class="tab active" data-screen="chat">المحادثة</button>
    <button class="tab" data-screen="repo">مستودع الملفات <span class="badge" id="repo-badge">0</span></button>
    <a class="tab" href="/usage" title="ما أُرسل للموديل وكم استهلك">الاستهلاك ↗</a>
  </nav>

  <div class="sources">
    <button id="sources-btn">
      <span>📁</span><span id="sources-label">كل المصادر مفعّلة</span><span>▾</span>
    </button>
    <div id="sources-panel" class="hidden">
      <label class="source-item head"><input type="checkbox" id="sys-all" checked>الأنظمة — تحديد الكل</label>
      <div id="system-toggles" class="nested"></div>
      <hr>
      <label class="source-item head"><input type="checkbox" id="cat-all" checked>مستودع الملفات — تحديد الكل</label>
      <div id="category-toggles" class="nested"></div>
    </div>
  </div>
</header>

<main id="screen-chat" class="screen active">
  <aside id="chat-rail">
    <div id="messages"></div>
    <div id="repo-link">
      <span id="repo-link-text">📁 لا يوجد ملفات في المستودع</span>
      <button data-screen="repo">إدارة الملفات ←</button>
    </div>
    <form id="form">
      <input id="q" type="text" placeholder="اسأل عن بياناتك…" autocomplete="off" />
      <button id="send" type="submit">إرسال</button>
    </form>
  </aside>

  <section id="dash-pane">
    <div id="dash"></div>
  </section>

</main>

<div id="screen-repo" class="screen">
  <div class="repo-bar">
    <label class="upload-btn">
      📎 رفع ملفات جديدة
      <input type="file" id="file-input" accept=".xlsx,.xls,.csv,.pdf" multiple hidden>
    </label>
    <div class="chips" id="filters"></div>
  </div>
  <div id="pending"></div>
  <div class="repo-grid" id="repo-grid"></div>
</div>

<datalist id="cat-suggestions"></datalist>
<div id="tip"></div>

<script>
const el = id => document.getElementById(id);
const state = {
  messages: [], dashboard: null, loading: false,
  systems: [], categories: [],            // available, from /api/sources
  onSystems: new Set(), onCategories: new Set(), // enabled
  files: [], pending: [], filter: 'الكل',
};
const PALETTE = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#008300'];
const GRID = '#e1e0d9', AXIS = '#c3c2b7';
// ---------- helpers ----------
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

function fmt(v) {
  if (typeof v !== 'number' || !isFinite(v)) return String(v ?? '—');
  const a = Math.abs(v);
  if (a >= 1e9) return (v / 1e9).toFixed(1) + 'B';
  if (a >= 1e6) return (v / 1e6).toFixed(1) + 'M';
  if (a >= 1e4) return (v / 1e3).toFixed(1) + 'K';
  return v.toLocaleString(undefined, { maximumFractionDigits: 2 });
}
const num = v => typeof v === 'number' ? v : (parseFloat(v) || 0);

function keysFor(w) {
  const rows = Array.isArray(w.data) ? w.data : [];
  const first = rows[0] || {};
  const ks = Object.keys(first);
  const xKey = w.xKey || ks.find(k => typeof first[k] !== 'number') || ks[0];
  const yKey = w.yKey || ks.find(k => k !== xKey && typeof first[k] === 'number') || ks[1];
  return { rows, xKey, yKey };
}

// Nice axis ticks
function ticks(max) {
  if (max <= 0) return [0, 1];
  const raw = max / 4, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].find(m => m * mag >= raw) * mag;
  const out = [];
  for (let v = 0; v <= max + step * 0.001; v += step) out.push(v);
  return out;
}

function showTip(e, html) {
  el.tip.innerHTML = html;
  el.tip.style.opacity = 1;
  const pad = 14;
  let x = e.clientX + pad, y = e.clientY + pad;
  const r = el.tip.getBoundingClientRect();
  if (x + r.width > innerWidth) x = e.clientX - r.width - pad;
  if (y + r.height > innerHeight) y = e.clientY - r.height - pad;
  el.tip.style.left = x + 'px'; el.tip.style.top = y + 'px';
}
const hideTip = () => { el.tip.style.opacity = 0; };

// Keeps the first/last axis label inside the viewBox instead of clipping it.
function anchorAt(x) { return x > W - 40 ? 'end' : x < ML + 12 ? 'start' : 'middle'; }

function svg(w, h, inner) {
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" role="img">${inner}</svg>`;
}
// Bar with rounded top corners only, anchored to the baseline.
function topRoundedBar(x, y, w, h, r) {
  r = Math.min(r, w / 2, h);
  return `M${x},${y + h} L${x},${y + r} Q${x},${y} ${x + r},${y} L${x + w - r},${y} `
       + `Q${x + w},${y} ${x + w},${y + r} L${x + w},${y + h} Z`;
}

// ---------- charts ----------
const W = 620, H = 300, ML = 62, MR = 12, MT = 12, MB = 38;

function axes(maxY, plotW, plotH) {
  return ticks(maxY).map(t => {
    const y = MT + plotH - (t / maxY) * plotH;
    return `<line x1="${ML}" y1="${y}" x2="${ML + plotW}" y2="${y}" stroke="${GRID}" stroke-width="1"/>`
         + `<text x="${ML - 10}" y="${y + 4}" text-anchor="end">${fmt(t)}</text>`;
  }).join('');
}

function barChart(w) {
  const { rows, xKey, yKey } = keysFor(w);
  if (!rows.length) return '<p style="color:#898781">No data</p>';
  const plotW = W - ML - MR, plotH = H - MT - MB;
  const maxY = Math.max(...rows.map(r => num(r[yKey])), 0) || 1;
  const band = plotW / rows.length, bw = Math.min(band * 0.6, 56);

  const bars = rows.map((r, i) => {
    const v = num(r[yKey]);
    const h = Math.max((v / maxY) * plotH, v > 0 ? 2 : 0);
    const x = ML + band * i + (band - bw) / 2, y = MT + plotH - h;
    const label = `${esc(r[xKey])}: <b>${fmt(v)}</b>`;
    return `<path class="mark" d="${topRoundedBar(x, y, bw, h, 4)}" fill="${PALETTE[0]}" data-tip="${label}"/>`;
  }).join('');

  const labels = rows.map((r, i) => {
    const x = ML + band * i + band / 2;
    return `<text x="${x}" y="${H - 14}" text-anchor="${anchorAt(x)}">${esc(String(r[xKey]).slice(0, 14))}</text>`;
  }).join('');

  return svg(W, H, axes(maxY, plotW, plotH)
    + `<line x1="${ML}" y1="${MT + plotH}" x2="${ML + plotW}" y2="${MT + plotH}" stroke="${AXIS}"/>`
    + bars + labels);
}

function lineChart(w) {
  const { rows, xKey, yKey } = keysFor(w);
  if (!rows.length) return '<p style="color:#898781">No data</p>';
  const plotW = W - ML - MR, plotH = H - MT - MB;
  const maxY = Math.max(...rows.map(r => num(r[yKey])), 0) || 1;
  const step = rows.length > 1 ? plotW / (rows.length - 1) : 0;
  const pt = i => [ML + step * i + (rows.length === 1 ? plotW / 2 : 0),
                   MT + plotH - (num(rows[i][yKey]) / maxY) * plotH];

  const path = rows.map((_, i) => (i ? 'L' : 'M') + pt(i).join(',')).join(' ');
  const dots = rows.map((r, i) => {
    const [x, y] = pt(i);
    return `<circle class="mark" cx="${x}" cy="${y}" r="4.5" fill="${PALETTE[0]}" `
         + `stroke="#fff" stroke-width="2" data-tip="${esc(r[xKey])}: <b>${fmt(num(r[yKey]))}</b>"/>`;
  }).join('');

  const every = Math.ceil(rows.length / 8);
  const labels = rows.map((r, i) => {
    if (i % every && i !== rows.length - 1) return '';
    const x = pt(i)[0];
    return `<text x="${x}" y="${H - 14}" text-anchor="${anchorAt(x)}">${esc(String(r[xKey]).slice(0, 12))}</text>`;
  }).join('');

  return svg(W, H, axes(maxY, plotW, plotH)
    + `<line x1="${ML}" y1="${MT + plotH}" x2="${ML + plotW}" y2="${MT + plotH}" stroke="${AXIS}"/>`
    + `<path d="${path}" fill="none" stroke="${PALETTE[0]}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`
    + dots + labels);
}

function pieChart(w) {
  const rows = (Array.isArray(w.data) ? w.data : []).map(r => ({
    label: r.label ?? Object.values(r).find(v => typeof v === 'string') ?? '—',
    value: num(r.value ?? Object.values(r).find(v => typeof v === 'number')),
  })).filter(r => r.value > 0);
  if (!rows.length) return '<p style="color:#898781">No data</p>';

  const total = rows.reduce((s, r) => s + r.value, 0);
  const S = 260, cx = S / 2, cy = S / 2, R = 100, r0 = 58;
  let angle = -Math.PI / 2;

  const arcs = rows.map((row, i) => {
    const sweep = (row.value / total) * Math.PI * 2;
    const gap = Math.min(0.02, sweep / 8);          // 2px-ish surface gap between slices
    const a0 = angle + gap / 2, a1 = angle + sweep - gap / 2;
    angle += sweep;
    const large = sweep > Math.PI ? 1 : 0;
    const p = (rad, a) => [cx + rad * Math.cos(a), cy + rad * Math.sin(a)];
    const [x0, y0] = p(R, a0), [x1, y1] = p(R, a1), [x2, y2] = p(r0, a1), [x3, y3] = p(r0, a0);
    const pct = ((row.value / total) * 100).toFixed(1);
    return `<path class="mark" d="M${x0},${y0} A${R},${R} 0 ${large} 1 ${x1},${y1} L${x2},${y2} `
         + `A${r0},${r0} 0 ${large} 0 ${x3},${y3} Z" fill="${PALETTE[i % PALETTE.length]}" `
         + `data-tip="${esc(row.label)}: <b>${fmt(row.value)}</b> (${pct}%)"/>`;
  }).join('');

  const legend = rows.map((row, i) =>
    `<span><i style="background:${PALETTE[i % PALETTE.length]}"></i>${esc(row.label)}</span>`
  ).join('');

  return `<div style="max-width:270px;margin:0 auto">${svg(S, S, arcs)}</div>`
       + `<div class="legend">${legend}</div>`;
}

function kpiCard(w) {
  const e = Array.isArray(w.data) ? w.data[0] : null;
  const v = e?.value ?? Object.values(e || {}).find(x => typeof x === 'number');
  return `<div class="kpi">${esc(fmt(v))}</div>`
       + (e?.label ? `<div class="kpi-label">${esc(e.label)}</div>` : '');
}

function tableCard(w) {
  const rows = Array.isArray(w.data) ? w.data : [];
  if (!rows.length) return '<p style="color:#898781">No data</p>';
  const cols = Object.keys(rows[0]);
  return `<div class="tablewrap"><table><thead><tr>${cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead>`
       + `<tbody>${rows.map(r => `<tr>${cols.map(c => {
           const v = r[c], n = typeof v === 'number';
           return `<td class="${n ? 'num' : ''}">${esc(n ? fmt(v) : (v ?? '—'))}</td>`;
         }).join('')}</tr>`).join('')}</tbody></table></div>`;
}

const RENDERERS = { kpi: kpiCard, bar: barChart, line: lineChart, pie: pieChart, table: tableCard };

// ---------- rendering ----------

// ---------- widget rendering ----------
/**
 * Widget sources are authored as two sentences: "<where it came from>. <how it was calculated>."
 * Split on the first ". " so each half gets its own labelled block in the ⓘ popover.
 */
function sourcePopover(source) {
  const at = source.indexOf('. ');
  const from = at > -1 ? source.slice(0, at + 1) : source;
  const method = at > -1 ? source.slice(at + 2) : '';
  return `<div class="src-pop">
    <div class="src-block"><span class="src-lbl">مصدر البيانات</span>${esc(from)}</div>
    ${method ? `<div class="src-block"><span class="src-lbl">طريقة الحساب</span>${esc(method)}</div>` : ''}
  </div>`;
}

function renderDashboard() {
  const d = state.dashboard;
  if (!d) {
    el.dash.innerHTML = state.loading
      ? `<div class="grid skeleton">${'<div class="card"><div class="bar"></div></div>'.repeat(4)}</div>`
      : `<div class="empty"><div>
           <div class="big">اسأل سؤالاً عن بياناتك</div>
           <div>مثال: «قارن الإيرادات بين المناطق» أو «أعطني تقريراً شاملاً»</div>
         </div></div>`;
    return;
  }

  const cards = (d.widgets || []).map(w => {
    const render = RENDERERS[(w.type || '').toLowerCase()];
    if (!render) return '';
    const wide = w.type === 'table' || w.type === 'line' ? ' wide' : '';
    const info = w.source ? `<button class="src-btn" type="button" aria-label="مصدر البيانات">ⓘ</button>` : '';
    const pop = w.source ? sourcePopover(w.source) : '';
    return `<div class="card${wide}${w.type === 'kpi' ? ' kpi' : ''}">
        ${pop}
        <div class="card-head"><h3>${esc(w.title)}</h3>${info}</div>
        ${render(w)}
      </div>`;
  }).join('');

  el.dash.innerHTML = `<div id="summary">${esc(d.summary)}</div>`
    + (cards ? `<div class="grid">${cards}</div>` : '');
  wireDashboard();
}

function wireDashboard() {
  el.dash.querySelectorAll('.src-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const pop = btn.closest('.card').querySelector('.src-pop');
      const open = pop.classList.contains('open');
      closePopovers();
      if (!open) { pop.classList.add('open'); btn.classList.add('active'); }
    });
  });
  el.dash.querySelectorAll('[data-tip]').forEach(mark => {
    mark.addEventListener('mousemove', e => showTip(e, mark.dataset.tip));
    mark.addEventListener('mouseleave', hideTip);
  });
}

function closePopovers() {
  document.querySelectorAll('.src-pop.open').forEach(p => p.classList.remove('open'));
  document.querySelectorAll('.src-btn.active').forEach(b => b.classList.remove('active'));
}
document.addEventListener('click', closePopovers);

// ---------- chat ----------
function renderMessages() {
  const items = state.messages.map(m =>
    `<div class="msg ${m.role === 'user' ? 'user' : (m.error ? 'err' : 'bot')}">${esc(m.text)}</div>`).join('');
  const typing = state.loading
    ? `<div class="msg bot dots"><span></span><span></span><span></span></div>` : '';
  const hint = state.messages.length === 0 && !state.loading
    ? `<div class="hint">اسأل سؤالاً عن بياناتك وسيبني لك المساعد لوحة معلومات.
         <span class="ex">جرّب: «ما إجمالي الإيرادات حسب المنطقة؟»</span></div>` : '';
  el.messages.innerHTML = hint + items + typing;
  el.messages.scrollTop = el.messages.scrollHeight;
}

async function ask(question) {
  const history = state.messages.filter(m => !m.error).slice(-10)
    .map(m => ({ role: m.role === 'user' ? 'user' : 'assistant', text: m.text }));

  state.messages.push({ role: 'user', text: question });
  state.loading = true;
  renderMessages(); renderDashboard(); el.send.disabled = true;

  try {
    const res = await fetch('/api/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: question, history,
        sources: { systems: [...state.onSystems], categories: [...state.onCategories] },
      }),
    });
    const payload = await res.json().catch(() => null);
    if (!res.ok || !payload?.dashboard) {
      state.messages.push({ role: 'bot', text: payload?.error || `تعذّر تنفيذ الطلب (${res.status})`, error: true });
    } else {
      state.dashboard = payload.dashboard;
      state.messages.push({ role: 'bot', text: payload.dashboard.summary });
    }
  } catch (err) {
    state.messages.push({ role: 'bot', text: 'تعذّر الوصول إلى الخادم: ' + err.message, error: true });
  } finally {
    state.loading = false; el.send.disabled = false;
    renderMessages(); renderDashboard();
  }
}

// ---------- sources ----------
async function loadSources() {
  const res = await fetch('/api/sources');
  const data = await res.json();
  const knownSystems = new Set(state.systems.map(s => s.id));
  const knownCategories = new Set(state.categories);

  state.systems = data.systems || [];
  state.categories = data.categories || [];

  // Newly appearing sources start enabled; the user's explicit choices are preserved.
  state.systems.forEach(s => { if (!knownSystems.has(s.id)) state.onSystems.add(s.id); });
  state.categories.forEach(c => { if (!knownCategories.has(c)) state.onCategories.add(c); });
  [...state.onCategories].forEach(c => { if (!state.categories.includes(c)) state.onCategories.delete(c); });

  renderSources();
}

function renderSources() {
  el('system-toggles').innerHTML = state.systems.map(s => `
    <label class="source-item">
      <input type="checkbox" class="sys-cb" data-id="${esc(s.id)}" ${state.onSystems.has(s.id) ? 'checked' : ''}>
      <span class="grow">${esc(s.name)}</span>
      ${s.connected ? '' : '<span class="note">غير مربوط بعد</span>'}
      ${s.refreshable ? `<button type="button" class="refresh-btn" data-refresh="${esc(s.id)}">⟳ جلب</button>` : ''}
    </label>
    ${s.refreshable ? `<div class="sys-status${s.error ? ' bad' : ''}" data-status="${esc(s.id)}">${systemStatusText(s)}</div>` : ''}`).join('');

  el('category-toggles').innerHTML = state.categories.length
    ? state.categories.map(c => `
        <label class="source-item">
          <input type="checkbox" class="cat-cb" data-cat="${esc(c)}" ${state.onCategories.has(c) ? 'checked' : ''}>
          ${esc(c)}
        </label>`).join('')
    : '<div class="nested-empty">لا يوجد تصنيفات بعد — ارفع ملفات أولاً</div>';

  el('system-toggles').querySelectorAll('[data-refresh]').forEach(btn =>
    btn.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); refreshSystem(btn); }));

  el('system-toggles').querySelectorAll('.sys-cb').forEach(cb => cb.addEventListener('change', () => {
    cb.checked ? state.onSystems.add(cb.dataset.id) : state.onSystems.delete(cb.dataset.id);
    syncSourceHeaders();
  }));
  el('category-toggles').querySelectorAll('.cat-cb').forEach(cb => cb.addEventListener('change', () => {
    cb.checked ? state.onCategories.add(cb.dataset.cat) : state.onCategories.delete(cb.dataset.cat);
    syncSourceHeaders();
  }));
  syncSourceHeaders();
}

function systemStatusText(s) {
  if (s.error) return 'تعذّر الجلب: ' + esc(s.error);
  if (!s.lastRefreshed) return 'لم يتم الجلب بعد — اضغط «جلب»';
  const when = new Date(s.lastRefreshed + (s.lastRefreshed.endsWith('Z') ? '' : 'Z'));
  return `${s.records.toLocaleString('en-US')} سجل · آخر جلب ${when.toLocaleTimeString('ar-EG')}`;
}

async function refreshSystem(btn) {
  const id = btn.dataset.refresh;
  const status = el('system-toggles').querySelector(`[data-status="${CSS.escape(id)}"]`);
  btn.disabled = true; btn.textContent = '⟳ جارٍ الجلب…';
  if (status) { status.className = 'sys-status'; status.textContent = 'جارٍ الجلب من النظام…'; }
  try {
    const res = await fetch(`/api/sources/${encodeURIComponent(id)}/refresh`, { method: 'POST' });
    const payload = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(payload.error || `فشل الجلب (${res.status})`);
    await loadSources();
  } catch (err) {
    if (status) { status.className = 'sys-status bad'; status.textContent = 'تعذّر الجلب: ' + err.message; }
    btn.disabled = false; btn.textContent = '⟳ جلب';
  }
}

function syncSourceHeaders() {
  el('sys-all').checked = state.systems.length > 0 && state.onSystems.size === state.systems.length;
  el('cat-all').checked = state.categories.length > 0 && state.onCategories.size === state.categories.length;
  const total = state.systems.length + state.categories.length;
  const on = state.onSystems.size + state.onCategories.size;
  el('sources-label').textContent =
    total === 0 ? 'لا يوجد مصادر'
    : on === 0 ? 'لا يوجد مصدر مفعّل'
    : on === total ? `كل المصادر مفعّلة (${total})`
    : `${on} من ${total} مصادر مفعّلة`;
}

el('sources-btn').addEventListener('click', e => {
  e.stopPropagation();
  el('sources-panel').classList.toggle('hidden');
});
el('sources-panel').addEventListener('click', e => e.stopPropagation());
document.addEventListener('click', () => el('sources-panel').classList.add('hidden'));

el('sys-all').addEventListener('change', e => {
  state.onSystems = e.target.checked ? new Set(state.systems.map(s => s.id)) : new Set();
  renderSources();
});
el('cat-all').addEventListener('change', e => {
  state.onCategories = e.target.checked ? new Set(state.categories) : new Set();
  renderSources();
});

// ---------- file repository ----------
async function loadFiles() {
  const res = await fetch('/api/repository/files');
  state.files = await res.json();
  if (!state.categories.length || state.files.some(f => !state.categories.includes(f.category)))
    await loadSources();
  renderRepo();
}

function repoCategories() {
  return [...new Set(state.files.map(f => f.category || 'عام'))];
}

function renderRepo() {
  el('repo-badge').textContent = state.files.length;
  el('repo-link-text').textContent = state.files.length
    ? `📁 ${state.files.length} ملف في المستودع`
    : '📁 لا يوجد ملفات في المستودع';

  const cats = ['الكل', ...repoCategories()];
  if (!cats.includes(state.filter)) state.filter = 'الكل';
  el('filters').innerHTML = cats.map(c =>
    `<button class="chip${c === state.filter ? ' active' : ''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');
  el('filters').querySelectorAll('.chip').forEach(chip => chip.addEventListener('click', () => {
    state.filter = chip.dataset.cat; renderRepo();
  }));

  el('cat-suggestions').innerHTML = repoCategories().map(c => `<option value="${esc(c)}">`).join('');

  const visible = state.filter === 'الكل'
    ? state.files : state.files.filter(f => (f.category || 'عام') === state.filter);

  el('repo-grid').innerHTML = visible.length ? visible.map(f => {
    const icon = f.kind === 'pdf' ? '📄' : '📊';
    const meta = f.kind === 'pdf'
      ? `${f.pageCount} صفحة`
      : `${f.rowCount} صف · ${f.columnCount} عمود`;
    const date = new Date(f.uploadedAt).toLocaleDateString('ar-EG');
    return `<div class="repo-card">
        <button class="del" data-id="${esc(f.id)}" title="حذف">✕</button>
        <div class="icon">${icon}</div>
        <div class="name">${esc(f.name)}</div>
        <div><span class="cat-badge">${esc(f.category || 'عام')}</span></div>
        <div class="meta">${meta} · ${date}</div>
      </div>`;
  }).join('')
    : `<div class="repo-empty">لا يوجد ملفات ${state.filter !== 'الكل' ? 'في هذا التصنيف' : 'في المستودع بعد'}. ارفع ملفاً من الأعلى.</div>`;

  el('repo-grid').querySelectorAll('.del').forEach(btn => btn.addEventListener('click', async () => {
    if (!confirm('حذف هذا الملف من المستودع؟')) return;
    await fetch('/api/repository/files/' + btn.dataset.id, { method: 'DELETE' });
    await loadFiles(); await loadSources();
  }));

  renderPending();
}

function renderPending() {
  el('pending').innerHTML = state.pending.map((p, i) => p.error
    ? `<div class="pending-card bad">
         <span>⚠️</span><span class="name">${esc(p.name)} — ${esc(p.error)}</span>
         <button class="cancel" data-idx="${i}">×</button>
       </div>`
    : `<div class="pending-card">
         <span>${p.kind === 'pdf' ? '📄' : '📊'}</span>
         <span class="name">${esc(p.name)} — ${p.kind === 'pdf' ? `${p.pageCount} صفحة` : `${p.rowCount} صف`}</span>
         <input list="cat-suggestions" placeholder="التصنيف (مثلاً: المالية)" value="عام" data-idx="${i}">
         <button class="save" data-idx="${i}">حفظ في المستودع</button>
         <button class="cancel" data-idx="${i}">×</button>
       </div>`).join('');

  el('pending').querySelectorAll('.save').forEach(btn => btn.addEventListener('click', async () => {
    const i = +btn.dataset.idx;
    const input = el('pending').querySelector(`input[data-idx="${i}"]`);
    const category = (input.value || 'عام').trim() || 'عام';
    btn.disabled = true; btn.textContent = 'جارٍ الحفظ…';
    const res = await fetch('/api/repository/files', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: state.pending[i].token, category }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      alert('تعذّر الحفظ: ' + (err.error || res.status));
      btn.disabled = false; btn.textContent = 'حفظ في المستودع';
      return;
    }
    state.pending.splice(i, 1);
    await loadFiles(); await loadSources();
  }));

  el('pending').querySelectorAll('.cancel').forEach(btn => btn.addEventListener('click', async () => {
    const i = +btn.dataset.idx;
    const token = state.pending[i].token;
    if (token) await fetch('/api/repository/pending/' + token, { method: 'DELETE' });
    state.pending.splice(i, 1);
    renderPending();
  }));
}

el('file-input').addEventListener('change', async e => {
  const files = [...e.target.files];
  if (!files.length) return;
  const form = new FormData();
  files.forEach(f => form.append('files', f));
  e.target.value = '';

  state.pending.push({ name: `جارٍ رفع ${files.length} ملف…`, kind: 'excel', rowCount: 0, error: null, token: null });
  renderPending();
  try {
    const res = await fetch('/api/repository/upload', { method: 'POST', body: form });
    const parsed = await res.json();
    state.pending.pop();
    state.pending.push(...parsed);
  } catch (err) {
    state.pending.pop();
    state.pending.push({ name: 'تعذّر الرفع', error: err.message });
  }
  renderPending();
});

// ---------- screens ----------
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === 'screen-' + name));
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.screen === name));
  if (name === 'repo') loadFiles();
}
document.querySelectorAll('[data-screen]').forEach(b =>
  b.addEventListener('click', () => showScreen(b.dataset.screen)));

// ---------- boot ----------
el.dash = el('dash'); el.messages = el('messages'); el.tip = el('tip'); el.send = el('send');

el('form').addEventListener('submit', e => {
  e.preventDefault();
  const q = el('q').value.trim();
  if (!q || state.loading) return;
  el('q').value = '';
  ask(q);
});

(async function boot() {
  renderMessages();
  renderDashboard();
  await loadSources();
  await loadFiles();
})();
</script>
</body>
</html>
