<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>عرض تقديمي</title>
<link rel="stylesheet" href="/css/tokens.css">
<style>
  /* صفحة مشاهدة عرض تقديمي عام (/p/{id}): شريط عنوان صغير + iframe معزول يملأ الباقي.
     المحتوى المرفوع يعمل داخل sandbox بلا allow-same-origin فلا يصل إلى كوكي النظام ولا واجهاته. */
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: #f4f5f7; color: #1f2430; font-family: "Tanseek", system-ui, -apple-system, "Segoe UI", sans-serif; }
  .bar { display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: #fff; border-bottom: 1px solid #e3e6ea; min-height: 44px; }
  .bar .logo { display: inline-flex; align-items: center; flex-shrink: 0; padding-inline-end: 12px; border-inline-end: 1px solid #e3e6ea; }
  .bar .logo img { height: 28px; width: auto; display: block; }
  .bar h1 { margin: 0; font-size: 16px; font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar .by { font-size: 12.5px; color: #6b7280; white-space: nowrap; }
  .bar a { font-size: 12.5px; color: #1f5fbf; text-decoration: none; white-space: nowrap; }
  .bar a:hover { text-decoration: underline; }
  .brand { font-size: 12px; color: #9aa3ad; white-space: nowrap; }
  iframe { flex: 1; width: 100%; border: 0; background: #fff; }
  .msg { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; }
  .msg .big { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  .msg .sub { color: #6b7280; }
  .hidden { display: none !important; }
  .brand b { color: #1f5fbf; font-weight: 700; }
  @media (max-width: 480px) { .bar .by, .brand { display: none; } .bar .logo img { height: 24px; } }
</style>
</head>
<body>
  <header class="bar">
    <a class="logo" href="/" title="جيم — منصة اللوحات والعروض" aria-label="جيم"><img src="/img/logo-lockup.svg" alt="جيم"></a>
    <h1 id="title">جارٍ التحميل…</h1>
    <span class="by" id="by"></span>
    <a id="open" href="#" target="_blank" rel="noopener" class="hidden">فتح في نافذة كاملة ↗</a>
    <span class="brand">عرض مشارك عبر <b>جيم</b></span>
  </header>
  <div class="msg hidden" id="msg"><div><div class="big" id="msg-big"></div><div class="sub" id="msg-sub"></div></div></div>
  <iframe id="frame" class="hidden" title="محتوى العرض"
          sandbox="allow-scripts allow-popups allow-forms allow-modals allow-downloads allow-popups-to-escape-sandbox"
          referrerpolicy="no-referrer"></iframe>
<script>
(async () => {
  // /p/{id} أو /p/{org}/{slug} — يُترجَم إلى مسار الواجهة المناسب
  const parts = location.pathname.split('/').filter(Boolean).slice(1).map(decodeURIComponent);
  const apiBase = parts.length >= 2
    ? `/api/presentations/by/${encodeURIComponent(parts[0])}/${encodeURIComponent(parts[1])}`
    : `/api/presentations/${encodeURIComponent(parts[0] || '')}`;
  const $ = s => document.getElementById(s);
  const show = (big, sub) => { $('msg').classList.remove('hidden'); $('msg-big').textContent = big; $('msg-sub').textContent = sub || ''; $('title').textContent = big; };
  try {
    const res = await fetch(`${apiBase}/meta`);
    if (res.status === 410) {
      const p = await res.json().catch(() => ({}));
      document.title = 'رابط غير نشط — عرض تقديمي';
      return show(`⚠️ ${p.reason || 'هذا الرابط لم يعد نشطًا.'}`, `تواصل مع ${p.creatorName || 'صاحب الرابط'} للحصول على رابط جديد.`);
    }
    if (!res.ok) return show('الرابط غير موجود أو تم حذفه.');
    const meta = await res.json();
    document.title = `${meta.title} — عرض تقديمي`;
    $('title').textContent = meta.title;
    if (meta.createdByName) $('by').textContent = `من ${meta.createdByName}`;
    const src = `${apiBase}/content`;
    $('open').href = src; $('open').classList.remove('hidden');
    $('frame').src = src; $('frame').classList.remove('hidden');
    installBridge(apiBase);
  } catch { show('تعذّر تحميل العرض.'); }
})();

/* جسر «بيانات العرض»: الصفحة المرفوعة (أصل معتم داخل iframe) ترسل {jeem:1,id,type,payload} بـ postMessage؛
   هنا نتحقق أن المرسل هو إطار العرض نفسه، ننفّذ الطلب على واجهة المنصة بصلاحيات من يفتح الرابط (الكوكي)،
   ونرد بنفس المعرّف. الأنواع: get / set / list / viewer. */
function installBridge(apiBase) {
  const frame = document.getElementById('frame');
  async function handle(type, payload) {
    const key = payload && payload.key;
    const okKey = typeof key === 'string' && /^[\w.-]{1,100}$/.test(key);
    if (type === 'viewer') return (await fetch(`${apiBase}/access`)).json();
    if (type === 'list') return (await fetch(`${apiBase}/data`)).json();
    if (!okKey) throw Object.assign(new Error('مفتاح غير صالح'), { code: 'bad_key', status: 400 });
    if (type === 'get') { const r = await fetch(`${apiBase}/data/${encodeURIComponent(key)}`, { cache: 'no-store' }); if (!r.ok) throw await err(r); return r.json(); }
    if (type === 'set') {
      const r = await fetch(`${apiBase}/data/${encodeURIComponent(key)}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ value: payload.value === undefined ? null : payload.value, version: typeof payload.version === 'number' ? payload.version : null }) });
      if (!r.ok) throw await err(r);
      return r.json();
    }
    throw Object.assign(new Error('نوع غير معروف'), { code: 'bad_type', status: 400 });
  }
  async function err(r) {
    const body = await r.json().catch(() => ({}));
    const code = r.status === 409 ? 'conflict' : r.status === 401 ? 'sign_in_required' : r.status === 403 ? 'forbidden' : r.status === 404 ? 'not_found' : 'error';
    return Object.assign(new Error(body.error || `خطأ (${r.status})`), { code, status: r.status, version: body.version });
  }
  window.addEventListener('message', async ev => {
    const m = ev.data;
    if (!m || m.jeem !== 1 || !m.id || ev.source !== frame.contentWindow) return;
    try { const result = await handle(m.type, m.payload || {}); ev.source.postMessage({ jeem: 1, id: m.id, result }, '*'); }
    catch (e) { ev.source.postMessage({ jeem: 1, id: m.id, error: { message: e.message, code: e.code || 'error', status: e.status, version: e.version } }, '*'); }
  });
}
</script>
</body>
</html>
